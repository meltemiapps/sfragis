appId: com.meltemiapps.sfragis
name: (f) Keys persist across a relaunch
env:
  KEY_NAME: Maria Vlachou
  KEY_EMAIL: maria.vlachou@example.org
  KEY_PASS: e2e only, not a real passphrase
---
- runFlow: ../common/fresh-launch.yaml
- runFlow: ../common/generate-key.yaml
- tapOn: "Back|Keyring"
- assertVisible: "Maria Vlachou, Your key.*"
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Maria Vlachou, Your key.*"
    timeout: 30000
- assertNotVisible: "No keys yet"
# The persisted private key still unlocks with its passphrase.
- tapOn: "Maria Vlachou, Your key.*"
- scrollUntilVisible:
    centerElement: true
    visibilityPercentage: 100
    element:
      id: "button-export-private-key"
- tapOn:
    id: "button-export-private-key"
- tapOn: "Continue"
- inputText: ${KEY_PASS}
# Submit with Return: the passphrase sheet moves with the keyboard, so a tap on the button can miss.
- pressKey: Enter
# The exported block appears below the fold and is taller than the screen, so scroll to it
# and accept it once part of it is on screen.
- scrollUntilVisible:
    visibilityPercentage: 10
    timeout: 30000
    element: "-----BEGIN PGP PRIVATE KEY BLOCK-----[\\s\\S]*"
